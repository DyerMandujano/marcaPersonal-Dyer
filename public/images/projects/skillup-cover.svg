<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" rx="16" fill="#101828"/>
  <defs>
    <linearGradient id="skillup-grad" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#skillup-grad)"/>
  
  <!-- Grid overlay -->
  <g opacity="0.1" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 75H800 M0 150H800 M0 225H800 M0 300H800 M0 375H800" />
    <path d="M100 0V450 M200 0V450 M300 0V450 M400 0V450 M500 0V450 M600 0V450 M700 0V450" />
  </g>

  <!-- Browser window frame -->
  <rect x="70" y="55" width="660" height="340" rx="12" fill="#0B1329" stroke="#334155" stroke-width="1.5"/>
  <circle cx="95" cy="78" r="5" fill="#EF4444"/>
  <circle cx="112" cy="78" r="5" fill="#F59E0B"/>
  <circle cx="129" cy="78" r="5" fill="#10B981"/>
  <rect x="155" y="70" width="280" height="16" rx="8" fill="#1E293B"/>
  <text x="170" y="82" font-family="monospace" font-size="10" fill="#94A3B8">https://skillup-learning.app</text>

  <!-- Content mockup -->
  <!-- Header bar -->
  <rect x="70" y="98" width="660" height="40" fill="#131C38"/>
  <rect x="95" y="110" width="80" height="16" rx="4" fill="url(#accent-grad)"/>
  <rect x="520" y="112" width="60" height="12" rx="4" fill="#334155"/>
  <rect x="590" y="112" width="60" height="12" rx="4" fill="#334155"/>
  <circle cx="685" cy="118" r="10" fill="#2563EB"/>

  <!-- Left sidebar -->
  <rect x="95" y="155" width="130" height="215" rx="8" fill="#131F3F"/>
  <rect x="110" y="175" width="100" height="12" rx="3" fill="#2563EB" opacity="0.8"/>
  <rect x="110" y="200" width="80" height="8" rx="3" fill="#475569"/>
  <rect x="110" y="220" width="90" height="8" rx="3" fill="#475569"/>
  <rect x="110" y="240" width="70" height="8" rx="3" fill="#475569"/>

  <!-- Main course cards -->
  <rect x="245" y="155" width="225" height="100" rx="8" fill="#1E293B" stroke="#334155"/>
  <rect x="260" y="170" width="60" height="14" rx="4" fill="#2563EB"/>
  <rect x="260" y="195" width="160" height="10" rx="3" fill="#CBD5E1"/>
  <rect x="260" y="212" width="110" height="8" rx="3" fill="#64748B"/>
  <rect x="260" y="235" width="195" height="4" rx="2" fill="#334155"/>
  <rect x="260" y="235" width="140" height="4" rx="2" fill="#06B6D4"/>

  <rect x="485" y="155" width="225" height="100" rx="8" fill="#1E293B" stroke="#334155"/>
  <rect x="500" y="170" width="60" height="14" rx="4" fill="#06B6D4"/>
  <rect x="500" y="195" width="160" height="10" rx="3" fill="#CBD5E1"/>
  <rect x="500" y="212" width="110" height="8" rx="3" fill="#64748B"/>
  <rect x="500" y="235" width="195" height="4" rx="2" fill="#334155"/>
  <rect x="500" y="235" width="90" height="4" rx="2" fill="#2563EB"/>

  <!-- Bottom section with stats -->
  <rect x="245" y="270" width="465" height="100" rx="8" fill="#131C38" stroke="#334155"/>
  <text x="265" y="298" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Plataforma E-Learning • SkillUp</text>
  <text x="265" y="322" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">Módulos: Cursos virtuales • Usuarios • Progreso • Certificados</text>
  <text x="265" y="348" font-family="monospace" font-size="10" fill="#06B6D4">Angular + Spring Boot + SQL Server</text>
</svg>
